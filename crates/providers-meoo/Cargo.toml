[package]
name = "agent2api-providers-meoo"
description = "Agent2API Meoo 秒悟提供商插件（独立发布）"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "agent2api-meoo"
path = "src/main.rs"

[dependencies]
agent2api-provider-protocol = { path = "../provider-protocol" }
agent2api-provider-sdk = { path = "../provider-sdk" }
serde_json = "1"
# OAuth PKCE: 随机字节 → base64url；challenge 与账号身份指纹都要 SHA-256。
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
# 授权码换票是 application/x-www-form-urlencoded，自己拼串更可控。
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util", "process"] }
