[package]
name = "agent2api-providers-opencode"
description = "Agent2API OpenCode 免费模型代理插件包（独立发布）"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "agent2api-opencode"
path = "src/main.rs"

[dependencies]
# 同仓库内的两个契约 crate（工作区成员）
agent2api-provider-protocol = { path = "../provider-protocol" }
agent2api-provider-sdk = { path = "../provider-sdk" }
serde_json = "1"
# 会话 / 项目 / 消息 id 的派生（与 opencode 客户端的 id 形状对齐）
sha2 = "0.10"
# 出网栈与合集包一致：rustls，不依赖系统 openssl
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
# 本机 v2 API 的 /api/event 是 SSE 长流，需要逐块消费 + 空闲超时
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
